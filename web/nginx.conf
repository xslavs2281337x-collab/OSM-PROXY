proxy_cache_path /var/cache/nginx/osm
  levels=1:2
  keys_zone=osm:100m
  max_size=70g
  inactive=90d
  use_temp_path=off;
  
upstream osm_tiles {
  server tile.openstreetmap.org:443;
  keepalive 16;
}

server {
  listen 80;
  server_name tiles.loesk.ru;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name tiles.loesk.ru;
  ssl_certificate /etc/nginx/ssl/tiles.loesk.ru.crt;
  ssl_session_ticket_key /etc/nginx/ssl/tiles.loesk.ru.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  location / {
    proxy_pass https://osm_tiles;
    proxy_ssl_server_name on;
    proxy_ssl_name tile.openstreetmap.org;
    proxy_set_header Host tile.openstreetmap.org;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_set_header User-Agent "Loesk-internal-tile-cache/1.0 (admin@loesk.ru)";

    proxy_cache osm;
    proxy_cache_key  $uri;
    proxy_cache_valid 200 30d;
    proxy_cache_valid 404 5m;
    proxy_cache_use_stale error | timeout | invalid_header | updating | http_500 | http_502 | http_503 | http_504 | http_403 | http_404 | http_429 | off ...;
    proxy_cache_lock on;
    proxy_ignore_headers Cache-Control Expires;

    proxy_hide_header X-cache;
    proxy_hide_header X-Cache-hits;
    add_header X-cache-status $upsteam_cache_status;
  }
}